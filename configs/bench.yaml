timezone: Asia/Shanghai
top_k: 5
candidate_pool_k: 20
request_timeout_seconds: 120
visibility_deadline_seconds: 120
poll_intervals_seconds: [0, 1, 2, 4, 8, 15]
max_poll_attempts: 12
max_transport_retries: 1
max_llm_calls: 500
max_embedding_calls: 1000
max_run_wall_seconds: 14400
effect_concurrency: 1
reliability_concurrency: 3

paths:
  mem0_root: /home/zhongdixiu/codes/MemoryBench/mem0
  mem0_python: /home/zhongdixiu/codes/MemoryBench/mem0/.venv/bin/python
  everos_root: /home/zhongdixiu/codes/MemoryBench/EverOS
  everos_python: /home/zhongdixiu/codes/MemoryBench/EverOS/.venv/bin/python
  email_agent_root: /home/zhongdixiu/codes/email_agent
  email_agent_python: /home/zhongdixiu/miniforge3/bin/python

providers:
  llm:
    model: qwen3.7-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    enable_thinking: false
    temperature: 0.0
  embedding:
    model: BAAI/bge-m3
    dimensions: 1024
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
  rerank:
    model: BAAI/bge-reranker-v2-m3
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY

tracks:
  r0:
    description: Same dense-vector retrieval, no reranking
    candidate_pool_k: 5
    final_top_k: 5
    rerank: false
  r1:
    description: Same dense-vector Top-20 followed by common reranking to Top-5
    candidate_pool_k: 20
    final_top_k: 5
    rerank: true
